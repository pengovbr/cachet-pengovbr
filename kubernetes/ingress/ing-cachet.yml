apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: ing-cachet
  namespace: cachet
spec:
  ingressClassName: nginx
  rules:
    - host: url.com
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - url.com
      secretName: yoursecretname
