apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-cachet-app
  name: app
  namespace: cachet
spec:
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-cachet-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: app
        workload.user.cattle.io/workloadselector: apps.deployment-cachet-app
      namespace: cachet
    spec:
      containers:
        - env:
            - name: SERVICE_NAME
              value: cachet-app
            - name: SERVICE_TAGS
              value: production
          envFrom:
            - configMapRef:
                name: cm-cachet
                optional: false
            - secretRef:
                name: se-cachet
                optional: false
          image: ghcr.io/pengovbr/cachet-pengovbr:1.0.0
          imagePullPolicy: Always
          name: container-0
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/www/html/storage
              name: vol-cachet-storage
              subPath: storage
          workingDir: /var/www/html
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: vol-cachet-storage
          persistentVolumeClaim:
            claimName: vol-cachet-storage
